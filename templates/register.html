
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artisan Registration | Artisan Marketplace</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="container" style="max-width: 500px; margin: 60px auto;">

        <h1>Create Artisan Account</h1>
        <p>Register to upload and manage your products.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}"
              method="POST">

            <div class="form-group">
                <label for="name">Artisan Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Create Account
            </button>

        </form>

        <p style="margin-top: 20px;">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

        <p>
            <a href="{{ url_for('home') }}">Back to Marketplace</a>
        </p>

    </main>

</body>
</html>
